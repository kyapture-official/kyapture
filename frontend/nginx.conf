# frontend/nginx.conf
#
# Replaces nginx's stock default.conf inside the frontend image.
#
# WHY THIS EXISTS: the frontend is a client-side-routed React SPA (React
# Router, see src/App.jsx) built to static files and served by this nginx
# image (see ../Dockerfile). Nginx's default config only knows about real
# files on disk (`try_files $uri $uri/ =404;`), so a fresh/hard-refreshed
# request for a client-side route — e.g. /dashboard/galleries or
# /auth/password/reset/confirm/<uid>/<token> — 404s, because no such file
# exists in the build output; only index.html + the JS bundle that renders
# those routes client-side actually exist on disk. The fix is the standard
# SPA fallback: if the requested path isn't a real file, serve index.html
# and let React Router take over from there.
#
# Scope is deliberately minimal — just what's needed to make deep-linked
# routes survive a refresh — not a general-purpose reverse proxy. The
# frontend and backend are separate origins here (see CORS_ALLOWED_ORIGINS /
# FRONTEND_URL in backend/config/settings/*.py and the credentialed
# `withCredentials: true` axios client in src/api/axiosInstance.js), so this
# file does not proxy /api to the backend — that split is already handled
# by the app talking cross-origin with cookies + CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets in transit (JS/CSS bundles, HTML).
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ─── SECURITY HEADERS (Phase 4) ─────────────────────────────────────
    # Deliberately minimal and conservative — this SPA is served
    # cross-origin from the API (see the file-level comment above), so
    # any header here that's wrong risks breaking real app functionality
    # with no way to verify in a browser from this environment. No
    # Content-Security-Policy is added: Vite's build output and this
    # app's actual runtime script/style/image/connect sources haven't
    # been enumerated and tested against one, and a wrong CSP silently
    # breaks the app rather than failing loudly — safer to leave that for
    # a follow-up done with real browser verification than guess one here.
    #
    # X-Frame-Options here mirrors the backend's own choice
    # (X_FRAME_OPTIONS = 'DENY' in config/settings/production.py) for the
    # SPA itself — nginx serves the static frontend on a separate origin
    # from Django, so the backend's header never covered these responses.
    # nginx's add_header does NOT inherit into a location block that
    # defines its own add_header (a well-known nginx quirk), so these are
    # repeated in the two location blocks below rather than relying on
    # inheritance from here.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com http://localhost:8000 https://api.kyapture.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; media-src 'self' http://localhost:8000 https://api.kyapture.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; connect-src 'self' http://localhost:8000 https://api.kyapture.com;" always;

    # Hashed, content-addressed build assets (Vite outputs
    # <name>.<hash>.js/css) are safe to cache aggressively — a content
    # change produces a new filename, not a stale cache hit.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com http://localhost:8000 https://api.kyapture.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; media-src 'self' http://localhost:8000 https://api.kyapture.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; connect-src 'self' http://localhost:8000 https://api.kyapture.com;" always;
        try_files $uri =404;
    }

    # SPA fallback: serve the real file if one exists (JS, CSS, images,
    # favicon, etc.), otherwise fall back to index.html so React Router can
    # resolve the client-side route. This is what makes a refresh on
    # /dashboard/galleries or /g/:username/:slug work instead of 404ing.
    location / {
        try_files $uri /index.html;
    }

    # index.html itself must never be cached, or a redeploy won't be
    # picked up by returning visitors until their cache expires.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://images.unsplash.com http://localhost:8000 https://api.kyapture.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; media-src 'self' http://localhost:8000 https://api.kyapture.com https://*.s3.amazonaws.com https://*.s3.us-east-1.amazonaws.com; connect-src 'self' http://localhost:8000 https://api.kyapture.com;" always;
    }
}
