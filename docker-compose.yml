# C:/Users/LENOVO/Desktop/kyapture/docker-compose.yml
# ─────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT STACK — not a production deployment manifest.
#
# Every service here is intentionally dev-shaped: the backend runs Django's
# `runserver` (not gunicorn), Postgres/Redis ports are exposed to the host
# for local psql/redis-cli debugging, and code is live-mounted for hot
# reload. Settings module selection follows that: every Django-based
# service (backend, celery_worker, celery_beat) takes its
# DJANGO_SETTINGS_MODULE from backend/.env — currently
# `config.settings.development` — so the three processes that make up one
# logical application always agree on which settings they're running under.
#
# Previously celery_worker/celery_beat force-overrode
# DJANGO_SETTINGS_MODULE=config.settings.production here while backend did
# not, so the web process and the task-queue processes silently ran under
# two different settings modules in the same "local dev" stack — and since
# production.py enforces real SECRET_KEY/S3/email/DB env vars (see its
# fail-loud guards), the worker and beat processes could not actually boot
# against this file's plain local Postgres/Redis config at all. Fixed by
# removing that override; all three now follow backend/.env like the web
# process already did.
#
# A real production deployment (ECS/k8s/systemd/whatever hosts this) is a
# separate manifest, not this file — it should set
# DJANGO_SETTINGS_MODULE=config.settings.production explicitly, alongside
# real SECRET_KEY/DB_*/AWS_*/DEFAULT_FROM_EMAIL values, and run gunicorn
# (the backend Dockerfile's own CMD) rather than `runserver`.
# ─────────────────────────────────────────────────────────────

services:
  # 1. DATABASE SERVICE (PostgreSQL)
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: photodelivery
      POSTGRES_USER: photodelivery
      POSTGRES_PASSWORD: photodelivery
    volumes:
      # Hardened Volume: Persists all data across container restarts and shutdowns
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Exposed for local pgAdmin/psql debugging
    # Lets backend/celery_worker/celery_beat's `depends_on: condition:
    # service_healthy` below mean "Postgres is actually accepting
    # connections," not just "the container process started" — compose's
    # plain depends_on (no condition) only ever guarantees the latter.
    # Each backend-image container's own docker-entrypoint.py still waits
    # + retries independently on top of this; this is belt-and-suspenders
    # at the orchestration level, not a replacement for it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photodelivery -d photodelivery"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. MESSAGE BROKER SERVICE (Redis)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"  # Exposed for Celery brokering and local diagnostics
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 3. WEB API SERVICE (Django REST Framework)
  backend:
    build: ./backend
    # Overrides Dockerfile CMD to use standard development auto-reload server
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app  # Live code mount (updates on save)
      - media_data:/app/media  # Shared media directory
    env_file:
      - ./backend/.env
    # backend/.env is also used by Windows development, where localhost is
    # correct. Inside Compose, the database and broker are service names.
    environment:
      DB_HOST: db
      DB_NAME: photodelivery
      DB_USER: photodelivery
      DB_PASSWORD: photodelivery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Shared cache for throttles and lockouts (7-B, debt row 108): Redis db 2.
      # `manage.py test` uses db 3, so a test run never wipes the app's counters.
      CACHE_REDIS_URL: redis://redis:6379/2
      CACHE_REDIS_TEST_URL: redis://redis:6379/3
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      # Where this stack serves the web app. Backend-built links (the "your download is
      # ready" email, password-reset and notification links) use it; it defaults to the
      # Vite dev port (5173), which nothing listens on under compose.
      FRONTEND_URL: http://localhost:3000
      # Stamped on each feedback row. The frontend build below gets the same ${APP_VERSION}
      # (VITE_APP_VERSION), so the two cannot differ unless one side is built without it.
      APP_VERSION: ${APP_VERSION:-dev}
      # Dev mail catcher (service `mailpit` below): emails are readable at http://localhost:8025.
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # 4. BACKGROUND TASK WORKER SERVICE (Celery)
  celery_worker:
    build: ./backend
    # Reuses the exact same backend build image but executes the Celery worker instead
    command: celery -A config worker -l info
    # DJANGO_SETTINGS_MODULE intentionally NOT overridden here — it comes
    # from backend/.env below, exactly like the `backend` service above, so
    # the worker always agrees with the web process on which settings
    # module it's running under. See the stack-level note at the top of
    # this file for why an explicit override here was wrong.
    volumes:
      - ./backend:/app  # Live code mount
      - media_data:/app/media  # Shared media directory
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_NAME: photodelivery
      DB_USER: photodelivery
      DB_PASSWORD: photodelivery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Shared cache for throttles and lockouts (7-B, debt row 108): Redis db 2.
      # `manage.py test` uses db 3, so a test run never wipes the app's counters.
      CACHE_REDIS_URL: redis://redis:6379/2
      CACHE_REDIS_TEST_URL: redis://redis:6379/3
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      # Where this stack serves the web app. Backend-built links (the "your download is
      # ready" email, password-reset and notification links) use it; it defaults to the
      # Vite dev port (5173), which nothing listens on under compose.
      FRONTEND_URL: http://localhost:3000
      # Dev mail catcher (service `mailpit` below): emails are readable at http://localhost:8025.
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: "1025"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4a. WEB SIZE WORKER (Celery, own queue). Encodes the exact-px Web Size
  # derivatives (apps/clients/web_size.py). Its --concurrency IS the CPU bound
  # for that work: at most 2 encodes at a time, whatever the request load.
  celery_websize:
    build: ./backend
    command: celery -A config worker -l info -Q websize --concurrency=2 -n websize@%h
    volumes:
      - ./backend:/app
      - media_data:/app/media
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_NAME: photodelivery
      DB_USER: photodelivery
      DB_PASSWORD: photodelivery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Shared cache for throttles and lockouts (7-B, debt row 108): Redis db 2.
      # `manage.py test` uses db 3, so a test run never wipes the app's counters.
      CACHE_REDIS_URL: redis://redis:6379/2
      CACHE_REDIS_TEST_URL: redis://redis:6379/3
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

      # 4b. PERIODIC TASK SCHEDULER (Celery Beat)
      # Ticks the schedule defined in config/celery.py's beat_schedule and
      # hands due tasks off to celery_worker above. This is a SEPARATE process
      # from the worker — Celery never runs beat inside a worker process, so
      # skipping this service means beat_schedule silently never fires.
  celery_beat:
    build: ./backend
    command: celery -A config beat -l info
    # Same as celery_worker above: DJANGO_SETTINGS_MODULE comes from
    # backend/.env, not an override here, so beat, the worker, and the web
    # process all run under one consistent settings module.
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_NAME: photodelivery
      DB_USER: photodelivery
      DB_PASSWORD: photodelivery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      # Shared cache for throttles and lockouts (7-B, debt row 108): Redis db 2.
      # `manage.py test` uses db 3, so a test run never wipes the app's counters.
      CACHE_REDIS_URL: redis://redis:6379/2
      CACHE_REDIS_TEST_URL: redis://redis:6379/3
      CELERY_TASK_ALWAYS_EAGER: "false"
      CELERY_TASK_EAGER_PROPAGATES: "false"
      # Where this stack serves the web app. Backend-built links (the "your download is
      # ready" email, password-reset and notification links) use it; it defaults to the
      # Vite dev port (5173), which nothing listens on under compose.
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. FRONTEND WEB SERVICE (React + Vite + Tailwind)
  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side URL of the API (the browser, not the container, calls
        # it) — the canonical dev backend published by the `backend` service.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
        VITE_APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 6. DEV MAIL CATCHER (Mailpit) — development only, never part of a production deploy.
  # Receives the SMTP mail the backend/worker send (download-ready emails, password
  # resets, notifications) and shows it at http://localhost:8025. Delivers nothing.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # web inbox
      - "1025:1025"  # SMTP

# ─────────────────────────────────────────────────────────────
# PERSISTENT SYSTEM VOLUMES (Prevents Data Loss)
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:  # Secure storage for PostgreSQL database entries
  media_data:     # Shared directory for local photo/video uploads in development
