version: "3.9"

services:
  # 1. DATABASE SERVICE (PostgreSQL)
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: photodelivery
      POSTGRES_USER: photodelivery
      POSTGRES_PASSWORD: photodelivery
    volumes:
      # Hardened Volume: Persists all data across container restarts and shutdowns
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"  # Exposed for local pgAdmin/psql debugging

  # 2. MESSAGE BROKER SERVICE (Redis)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"  # Exposed for Celery brokering and local diagnostics

  # 3. WEB API SERVICE (Django REST Framework)
  backend:
    build: ./backend
    # Overrides Dockerfile CMD to use standard development auto-reload server
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app  # Live code mount (updates on save)
      - media_data:/app/media  # Shared media directory
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  # 4. BACKGROUND TASK WORKER SERVICE (Celery)
  celery_worker:
    build: ./backend
    # Reuses the exact same backend build image but executes the Celery worker instead
    command: celery -A config worker -l info
    volumes:
      - ./backend:/app  # Live code mount
      - media_data:/app/media  # Shared media directory
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis

  # 5. FRONTEND WEB SERVICE (React + Vite + Tailwind)
  frontend:
    build: ./frontend
    ports:
      - "3000:80"

# ─────────────────────────────────────────────────────────────
# PERSISTENT SYSTEM VOLUMES (Prevents Data Loss)
# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:  # Secure storage for PostgreSQL database entries
  media_data:     # Shared directory for local photo/video uploads in development